# Конфигурация Seasonfall.
# Изменения применяются на лету — перезапускать программу не нужно.
# Все параметры необязательны: без файла работают значения по умолчанию.

[location]
# Точка, для которой запрашивается погода. По умолчанию — Москва.
name = "Реутов"
latitude = 55.7558
longitude = 37.6173
timezone = "Europe/Moscow"

[weather]
# Как часто обновлять погоду (минуты).
update_minutes = 10
# Минимальное количество осадков в мм, которое считается дождём/снегом.
precip_threshold_mm = 0.02
# Таймаут запроса к Open-Meteo (секунды).
timeout_seconds = 10
# Сколько минут можно показывать данные из кэша при недоступной сети.
cache_minutes = 180

[effects]
# Можно отключить ненужные эффекты.
rain = true
snow = true
autumn_leaves = true
spring_petals = true
summer_fluff = true
winter_frost = true
# Вспышки при грозе (только вместе с дождём).
lightning = true
# Легкая цветовая дымка поверх экрана при осадках, 0..1.
tint = 0.07

[render]
# Частота кадров. 30 — плавно, 20 — экономнее.
fps = 60
# Плотность частиц: 0.5 — реже, 2.0 — гуще.
density = 2.0
# Насколько приглушать частицы ночью, 0..1 (1 — не приглушать).
night_dim = 0.85
# Зерно случайности. Если не задавать — каждый запуск разный.
# seed = 12345
